on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.22.x]
        # macos-latest is macOS 26, whose dyld rejects Go 1.22 binaries (no LC_UUID).
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  single-ver:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.22.x

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Test 386
        run: GOOS=linux GOARCH=386 go test ./...
