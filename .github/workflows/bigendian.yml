
name: Go-PPC64-CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.24.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install
      run: |
        sudo apt-get update
        # User-mode QEMU runs the ppc64 test binary. qemu-system-ppc64 is only a
        # virtual package on Ubuntu 26.04, so apt cannot install it by that name.
        sudo apt install -y qemu-user qemu-user-binfmt
    - name: Test
      run: |
        GOARCH=ppc64 go test ./...
